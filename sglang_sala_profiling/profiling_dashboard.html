<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MiniCPM-SALA FlashInfer Profiling - 64 Concurrency</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',monospace;background:#0d1117;color:#c9d1d9;padding:20px}
h1{color:#58a6ff;margin-bottom:5px;font-size:22px}
h2{color:#79c0ff;margin:25px 0 10px;font-size:16px;border-bottom:1px solid #21262d;padding-bottom:5px}
h3{color:#d2a8ff;margin:15px 0 8px;font-size:14px}
.sub{color:#8b949e;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}
.card{background:#161b22;border:1px solid #21262d;border-radius:6px;padding:15px}
.full{grid-column:1/-1}
.m{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #21262d;font-size:13px}
.m:last-child{border-bottom:none}
.ml{color:#8b949e}.mv{color:#f0f6fc;font-weight:600}.hi{color:#f85149}.gd{color:#3fb950}.wn{color:#d29922}
.br{display:flex;align-items:center;margin:2px 0;font-size:12px}
.bl{width:200px;color:#8b949e;text-align:right;padding-right:8px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bw{flex:1;height:18px;background:#21262d;border-radius:3px;position:relative;overflow:hidden}
.b{height:100%;border-radius:3px;display:flex;align-items:center;padding-left:5px;font-size:11px;color:#fff;min-width:1px}
.bv{position:absolute;right:5px;top:0;height:100%;display:flex;align-items:center;font-size:11px;color:#8b949e}
.leg{display:flex;gap:15px;flex-wrap:wrap;margin:8px 0;font-size:12px}
.li{display:flex;align-items:center;gap:4px}
.ld{width:10px;height:10px;border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:12px;margin:5px 0}
th{text-align:left;color:#58a6ff;padding:5px 8px;border-bottom:1px solid #30363d;font-weight:600}
th.r,td.r{text-align:right}
td{padding:4px 8px;border-bottom:1px solid #21262d}
tr:hover td{background:#1c2128}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600}
.tm{background:#f8514922;color:#f85149}.tl{background:#58a6ff22;color:#58a6ff}
.note{margin-top:10px;color:#f85149;font-size:13px}
</style>
</head>
<body>
<h1>MiniCPM-SALA Profiling: FlashInfer Backend, 64 Concurrency</h1>
<p class="sub">W4A16 GPTQ Marlin | FP8 KV Cache | --disable-cuda-graph | 3.88M input, 410K output, 64 reqs<br>
Benchmark: 1,815.86s (production ~1,036s with CUDA graph) | 125 prefill steps | 30,055 decode steps</p>
<div id="D"></div>
<script>
function parseCSV(t){const L=t.trim().split('\n'),D=[];for(let i=1;i<L.length;i++){const p=L[i].split(',');if(p.length<6)continue;const k=p[0],s=k.split('/');let lt=s[1];if(lt==='lightning-attn')lt='lightning';D.push({key:k,layer:s[0],layerType:lt,component:s.slice(2).join('/'),layerNum:parseInt(s[0].slice(1)),total_ms:+p[1],count:+p[2],avg_ms:+p[3],min_ms:+p[4],max_ms:+p[5]})}return D}
function fmt(v){return v>=1000?(v/1000).toFixed(1)+'s':v>=1?v.toFixed(1)+'ms':(v*1000).toFixed(0)+'µs'}
function pct(v,t){return t>0?(v/t*100).toFixed(1)+'%':'0%'}
const NESTED=['attn_kernel','chunk_simple_gla','fused_recurrent','fla_kernel','fla_state_load','fla_state_save','sigmoid_gate','rope','qk_norm','o_norm'];
function isNested(c){return NESTED.some(n=>c.includes(n+'/'))}

function render(data){
const PS=125,DS=30055;
const prefill=data.filter(d=>d.component.endsWith('/prefill')&&!d.key.startsWith('model/'));
const decode=data.filter(d=>d.component.endsWith('/decode')&&!d.key.startsWith('model/'));
const other=data.filter(d=>d.key.startsWith('model/'));
const tP=prefill.filter(d=>!isNested(d.component)).reduce((s,d)=>s+d.total_ms,0);
const tD=decode.filter(d=>!isNested(d.component)).reduce((s,d)=>s+d.total_ms,0);
const tO=other.reduce((s,d)=>s+d.total_ms,0);
const G=tP+tD+tO;
let h='';

// Overview
h+='<div class="grid"><div class="card"><h3>Time Split</h3>';
[['Prefill',tP,'#d29922'],['Decode',tD,'#58a6ff'],['Other',tO,'#8b949e']].forEach(([l,ms,c])=>{
h+=`<div class="br"><span class="bl">${l}</span><div class="bw"><div class="b" style="width:${ms/G*100}%;background:${c}">${pct(ms,G)}</div><span class="bv">${fmt(ms)}</span></div></div>`});
h+='</div>';

const mc4AP=data.filter(d=>d.layerType==='minicpm4'&&d.component==='attn_kernel/prefill').reduce((s,d)=>s+d.total_ms,0);
const mc4AD=data.filter(d=>d.layerType==='minicpm4'&&d.component==='attn_kernel/decode').reduce((s,d)=>s+d.total_ms,0);
h+='<div class="card"><h3>Key Numbers</h3>';
h+=`<div class="m"><span class="ml">Total layer time</span><span class="mv">${fmt(G)}</span></div>`;
h+=`<div class="m"><span class="ml">Prefill per step</span><span class="mv">${fmt(tP/PS)}</span></div>`;
h+=`<div class="m"><span class="ml">Decode per step</span><span class="mv">${fmt(tD/DS)}</span></div>`;
h+=`<div class="m"><span class="ml">MiniCPM4 attn_kernel total</span><span class="mv hi">${fmt(mc4AP+mc4AD)}</span></div>`;
h+=`<div class="m"><span class="ml">Lightning decode total</span><span class="mv wn">${fmt(decode.filter(d=>d.layerType==='lightning').reduce((s,d)=>s+d.total_ms,0))}</span></div>`;
h+='</div></div>';

// Per-layer bars
h+='<h2>Per-Layer Time</h2><div class="card full">';
const LT={};
data.filter(d=>!d.key.startsWith('model/')&&!isNested(d.component)).forEach(d=>{
if(!LT[d.layer])LT[d.layer]={type:d.layerType,p:0,d:0};
if(d.component.endsWith('/prefill'))LT[d.layer].p+=d.total_ms;else if(d.component.endsWith('/decode'))LT[d.layer].d+=d.total_ms;
});
const maxLT=Math.max(...Object.values(LT).map(v=>v.p+v.d));
Object.keys(LT).sort((a,b)=>parseInt(a.slice(1))-parseInt(b.slice(1))).forEach(l=>{
const v=LT[l],t=v.p+v.d,c=v.type==='minicpm4'?'#f85149':'#58a6ff',pp=v.p/maxLT*100,pd=v.d/maxLT*100;
h+=`<div class="br"><span class="bl">${l} <span class="tag ${v.type==='minicpm4'?'tm':'tl'}">${v.type}</span></span>
<div class="bw"><div class="b" style="width:${(pp+pd)}%;background:${c};opacity:0.6"><div style="width:${pp/(pp+pd)*100}%;height:100%;background:${c};border-radius:3px 0 0 3px"></div></div>
<span class="bv">${fmt(t)}</span></div></div>`});
h+='<div class="leg"><div class="li"><div class="ld" style="background:#f85149"></div>minicpm4</div><div class="li"><div class="ld" style="background:#58a6ff"></div>lightning</div><div class="li"><div class="ld" style="background:currentColor;opacity:0.4"></div>= decode portion</div></div></div>';

// Decode breakdown
h+='<h2>Decode Per-Step Breakdown</h2><div class="grid">';
// MiniCPM4
h+='<div class="card"><h3>MiniCPM4 (8 layers) per decode step</h3>';
const mc4D={};decode.filter(d=>d.layerType==='minicpm4').forEach(d=>{const c=d.component.replace('/decode','');mc4D[c]=(mc4D[c]||0)+d.total_ms/DS});
const mc4DT=Object.values(mc4D).reduce((s,v)=>s+v,0);
const mc4C={attn:'#f85149',attn_kernel:'#ff7b72',mlp:'#3fb950',qkv_proj:'#79c0ff',o_gate:'#d2a8ff',o_proj:'#58a6ff',post_attn_norm:'#d29922',input_norm:'#8b949e'};
Object.entries(mc4D).sort((a,b)=>b[1]-a[1]).forEach(([c,ms])=>{
h+=`<div class="br"><span class="bl">${c}</span><div class="bw"><div class="b" style="width:${ms/mc4DT*100}%;background:${mc4C[c]||'#8b949e'}">${pct(ms,mc4DT)}</div><span class="bv">${(ms*1000).toFixed(0)}µs</span></div></div>`});
h+=`<div class="m" style="margin-top:8px"><span class="ml">Total/step</span><span class="mv hi">${fmt(mc4DT)}</span></div></div>`;

// Lightning
h+='<div class="card"><h3>Lightning (24 layers) per decode step</h3>';
const lnD={};decode.filter(d=>d.layerType==='lightning').forEach(d=>{const c=d.component.replace('/decode','');lnD[c]=(lnD[c]||0)+d.total_ms/DS});
const lnDT=Object.values(lnD).reduce((s,v)=>s+v,0);
const lnC={attn:'#58a6ff',fla_kernel:'#79c0ff',fused_recurrent_gla:'#388bfd',mlp:'#3fb950',sigmoid_gate:'#d2a8ff',fla_state_load:'#bc8cff',fla_state_save:'#a371f7',rope:'#d29922',qkv_proj:'#79c0ff',qk_norm:'#56d364',o_proj:'#3fb950',o_norm:'#8b949e',post_attn_norm:'#d29922',input_norm:'#484f58'};
Object.entries(lnD).sort((a,b)=>b[1]-a[1]).forEach(([c,ms])=>{
h+=`<div class="br"><span class="bl">${c}</span><div class="bw"><div class="b" style="width:${ms/lnDT*100}%;background:${lnC[c]||'#8b949e'}">${pct(ms,lnDT)}</div><span class="bv">${(ms*1000).toFixed(0)}µs</span></div></div>`});
h+=`<div class="m" style="margin-top:8px"><span class="ml">Total/step</span><span class="mv">${fmt(lnDT)}</span></div></div></div>`;

// Decode attribution
const oD=other.filter(d=>d.key.includes('/decode')).reduce((s,d)=>s+d.total_ms,0)/DS;
const allDT=mc4DT+lnDT+oD;
h+='<div class="card full"><h3>Decode Time Attribution</h3>';
[['Lightning attention (24 layers)',lnDT,'#58a6ff'],['MiniCPM4 dense attention (8 layers)',mc4DT,'#f85149'],['Other (logits/embed)',oD,'#8b949e']].forEach(([l,ms,c])=>{
h+=`<div class="br"><span class="bl">${l}</span><div class="bw"><div class="b" style="width:${ms/allDT*100}%;background:${c}">${pct(ms,allDT)}</div><span class="bv">${fmt(ms)}/step</span></div></div>`});
h+=`<div class="m" style="margin-top:8px"><span class="ml">Total per decode step</span><span class="mv">${fmt(allDT)}</span></div></div>`;

// Prefill top components
h+='<h2>Prefill Per-Step Breakdown (Top 15)</h2><div class="card full">';
const pC={};prefill.forEach(d=>{const l=d.layerType+'/'+d.component.replace('/prefill','');if(!pC[l])pC[l]={ms:0,t:d.layerType};pC[l].ms+=d.total_ms/PS});
Object.entries(pC).sort((a,b)=>b[1].ms-a[1].ms).slice(0,15).forEach(([l,{ms,t}])=>{
const c=t==='minicpm4'?'#f85149':'#58a6ff',pT=Object.values(pC).reduce((s,v)=>s+v.ms,0);
h+=`<div class="br"><span class="bl">${l}</span><div class="bw"><div class="b" style="width:${ms/pT*100}%;background:${c}">${pct(ms,pT)}</div><span class="bv">${fmt(ms)}</span></div></div>`});
h+='</div>';

// MiniCPM4 attn kernel table
h+='<h2>MiniCPM4 attn_kernel Per Layer (Optimization Target)</h2><div class="card full">';
h+='<table><tr><th>Layer</th><th class="r">Prefill Total</th><th class="r">Prefill Avg</th><th class="r">Prefill Max</th><th class="r">Decode Total</th><th class="r">Decode Avg</th><th class="r">Combined</th></tr>';
let mc4T=0;
[0,9,16,17,22,29,30,31].forEach(n=>{
const ln='L'+String(n).padStart(2,'0');
const p=data.find(d=>d.layer===ln&&d.component==='attn_kernel/prefill');
const d2=data.find(d=>d.layer===ln&&d.component==='attn_kernel/decode');
const pt=p?p.total_ms:0,pa=p?p.avg_ms:0,pm=p?p.max_ms:0;
const dt=d2?d2.total_ms:0,da=d2?d2.avg_ms:0;
const c=pt+dt;mc4T+=c;
h+=`<tr><td>${ln}</td><td class="r">${fmt(pt)}</td><td class="r">${fmt(pa)}</td><td class="r" style="color:#f85149">${fmt(pm)}</td><td class="r">${fmt(dt)}</td><td class="r">${(da*1000).toFixed(0)}µs</td><td class="r" style="font-weight:700">${fmt(c)}</td></tr>`});
h+=`<tr style="border-top:2px solid #30363d"><td style="font-weight:700">TOTAL</td><td class="r" style="font-weight:700">${fmt(mc4AP)}</td><td></td><td></td><td class="r" style="font-weight:700">${fmt(mc4AD)}</td><td></td><td class="r" style="font-weight:700;color:#f85149">${fmt(mc4T)}</td></tr>`;
h+='</table><p class="note">Dense attention over full context. Sparse block selection would reduce prefill from ~145ms to ~10ms per layer per step.</p></div>';

// Lightning decode component table
h+='<h2>Lightning Attention Components (Decode)</h2><div class="card full">';
h+='<table><tr><th>Component</th><th class="r">Total</th><th class="r">% of Lightning</th><th class="r">Per Step</th><th class="r">Per Layer/Step</th><th class="r">Calls</th></tr>';
const lnA={};decode.filter(d=>d.layerType==='lightning').forEach(d=>{const c=d.component.replace('/decode','');if(!lnA[c])lnA[c]={t:0,n:0};lnA[c].t+=d.total_ms;lnA[c].n+=d.count});
const lnAT=Object.values(lnA).reduce((s,v)=>s+v.t,0);
Object.entries(lnA).sort((a,b)=>b[1].t-a[1].t).forEach(([c,{t,n}])=>{
h+=`<tr><td>${c}</td><td class="r">${fmt(t)}</td><td class="r">${pct(t,lnAT)}</td><td class="r">${fmt(t/DS)}</td><td class="r">${((t/DS/24)*1000).toFixed(0)}µs</td><td class="r">${n.toLocaleString()}</td></tr>`});
h+=`<tr style="border-top:2px solid #30363d"><td style="font-weight:700">TOTAL</td><td class="r" style="font-weight:700">${fmt(lnAT)}</td><td></td><td class="r" style="font-weight:700">${fmt(lnAT/DS)}</td><td></td><td></td></tr>`;
h+='</table></div>';

document.getElementById('D').innerHTML=h;
}

fetch('results/flashinfer/c64/sala_timings.csv').then(r=>r.text()).then(t=>render(parseCSV(t))).catch(()=>{
document.getElementById('D').innerHTML='<p style="color:#f85149">Failed to load CSV. Open this HTML from sglang_sala_profiling/ directory, or run: python3 -m http.server 8080</p>';
});
</script>
</body>
</html>
